<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookFromHome - Planner</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/site-polish.css">
    <link rel="stylesheet" href="css/planner.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/site-layout.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
    <!-- HEADER -->
    <header class="site-topbar">
    <div class="container header-content">
        <a href="index.html" class="logo">CookFromHome</a>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="recipes.html">Recipes</a>
            <a href="planner.html" aria-current="page">Planner</a>
            <a href="tips.html">Tips</a>
            <a href="pantry.html">Pantry</a>
            <a href="forms.html">Forms</a>
        </nav>
        <button id="theme-button" class="theme-toggle" type="button"
                aria-pressed="false" aria-label="Switch to dark theme">Dark theme</button>
    </div>
</header>

    <!-- MAIN CONTENT -->
    <main class="planner-wrapper" id="main-content">
      <header class="planner-header-box">
        <h2>Weekly Meal Plan 🥗</h2>
        <p>Customize your diet and manage your shopping list with ease</p>
      </header>

      <div class="planner-grid-layout">
        <section id="daysContainer">
        </section>

        <aside>
          <div class="sidebar-card">
            <h3>⚙️ Plan Settings</h3>
            <div class="form-field">
              <label for="daysSelect">Period:</label>
              <select id="daysSelect">
                <option value="7" selected>7 Days (Full Week)</option>
                <option value="5">5 Days (Weekdays)</option>
                <option value="3">3 Days (Weekend)</option>
              </select>
            </div>

            <div class="form-field">
              <label for="targetCalories">Target (kcal/day):</label>
              <input type="number" id="targetCalories" value="2000" step="50">
            </div>

            <button type="button" class="btn-action">Update Plan</button>
          </div>

          <div class="sidebar-card">
            <h3>
              🛒 Grocery List
              <span id="progressTracker" class="progress-text">0/0 completed</span>
            </h3>
            
            <div class="add-item-box">
              <input type="text" id="customInput" aria-label="New grocery item" placeholder="Add an item...">
              <button type="button" class="btn-add">+ Add</button>
            </div>

            <div id="checklistGroup">
              <div class="checklist-row">
                <div class="checklist-left">
                  <input type="checkbox" id="item1">
                  <label for="item1">Cottage cheese (400g)</label>
                </div>
                <button type="button" class="btn-delete-item" aria-label="Remove grocery item">×</button>
              </div>

              <div class="checklist-row">
                <div class="checklist-left">
                  <input type="checkbox" id="item2">
                  <label for="item2">Chicken breast (1 kg)</label>
                </div>
                <button type="button" class="btn-delete-item" aria-label="Remove grocery item">×</button>
              </div>

              <div class="checklist-row">
                <div class="checklist-left">
                  <input type="checkbox" id="item3">
                  <label for="item3">Fresh greens & avocado</label>
                </div>
                <button type="button" class="btn-delete-item" aria-label="Remove grocery item">×</button>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
    <div class="container footer-content">
        <h2>CookFromHome</h2>
        <p>Cook by yourself :3</p>
    </div>
</footer>

    <!-- JAVASCRIPT -->
    <script src="js/vendor/jquery-3.6.0.min.js"></script>
    <script src="js/planner.js"></script>
    <script src="js/site.js"></script>
</body>
</html>
